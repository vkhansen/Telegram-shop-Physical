#cloud-config
# Hetzner Falkenstein (fsn1, Germany) bootstrap for telegram-shop. SSH keys are injected by Hetzner
# at create time (ssh_keys API). This file does not embed private keys.

users:
  - name: deploy
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - fail2ban
  - git
  - jq
  - rsync
  - ufw
  - unattended-upgrades

write_files:
  - path: /etc/ssh/sshd_config.d/50-hardening.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PermitRootLogin prohibit-password
      PubkeyAuthentication yes
      AuthenticationMethods publickey
      X11Forwarding no
      AllowTcpForwarding no
      AllowUsers deploy
      ClientAliveInterval 60
      ClientAliveCountMax 3
  - path: /etc/fail2ban/jail.d/sshd.local
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      bantime = 1h
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  - install -d -o deploy -g deploy -m 0700 /home/deploy/.ssh
  - |
    if [ -f /root/.ssh/authorized_keys ]; then
      cp /root/.ssh/authorized_keys /home/deploy/.ssh/authorized_keys
      chown deploy:deploy /home/deploy/.ssh/authorized_keys
      chmod 600 /home/deploy/.ssh/authorized_keys
    fi
  - systemctl reload ssh || systemctl reload sshd || true
  - |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    chmod a+r /etc/apt/keyrings/docker.asc
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
    apt-get update
    apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
    usermod -aG docker deploy
  - |
    curl -fsSL https://tailscale.com/install.sh | sh
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 41641/udp comment 'tailscale'
  - ufw --force enable
  - mkdir -p /opt/telegram-shop
  - chown deploy:deploy /opt/telegram-shop
  - systemctl enable --now docker
  - systemctl enable --now fail2ban
  - systemctl enable --now tailscaled

final_message: "telegram-shop-fsn cloud-init done. Join Tailscale then close public SSH."
